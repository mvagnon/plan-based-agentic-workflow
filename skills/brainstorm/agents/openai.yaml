interface:
  display_name: "Brainstorm"
  short_description: "Compare handmade vs dependency approaches before PM planning."
  default_prompt: "Use this skill when the user wants to brainstorm the best way to integrate a feature, compare implementation strategies, evaluate build-vs-buy, or decide between a handmade in-house implementation and an external dependency before creating PM tasks or writing code. Treat the user's request as complete, do not ask clarification questions, do not recommend Plan Mode, analyze the repository with Serena MCP first, then research from broad to precise with Exa, Context7, and gh CLI, return one handmade approach, one external-dependency approach when credible, and one clear recommendation, then end with exactly two next-step options: invoke feed-pm with the recommended strategy or challenge the strategy."
dependencies:
  tools:
    - type: "mcp"
      value: "serena"
      description: "Required semantic code exploration and repository-context analysis."
    - type: "mcp"
      value: "exa"
      description: "Required broad web research for current approaches, alternatives, and risks."
    - type: "mcp"
      value: "context7"
      description: "Required official documentation lookup for frameworks, SDKs, APIs, and candidate dependencies."
    - type: "cli"
      value: "gh"
      description: "Required GitHub repository, release, issue, license, and maintenance inspection."
policy:
  allow_implicit_invocation: true
