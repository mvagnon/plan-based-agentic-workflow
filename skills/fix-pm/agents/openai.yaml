interface:
  display_name: "Fix PM"
  short_description: "Adjust already-created PM tasks."
  default_prompt: "Use this skill when the request provides both required inputs: existing task URL(s) or ID(s), and the changes to apply. The skill retrieves existing PM tasks, applies requested task-spec changes in place, uses at most one normal-chat Decision Gate for ambiguous or structurally risky updates, verifies the updated tasks, and returns a concise recap. It does not implement code, create branches, create PRs, review PRs, merge, or close tasks by default."
dependencies:
  tools:
    - type: "cli"
      value: "gh"
      description: "Required when task URLs point to GitHub Issues."
    - type: "mcp"
      value: "serena"
      description: "Required when requested changes alter technical task scope or implementation details."
policy:
  allow_implicit_invocation: true
