interface:
  display_name: "Implement PM"
  short_description: "Implement PM tasks in the current checkout."
  default_prompt: "Use $implement-pm to create one dedicated branch and draft PR for this invocation, then implement the referenced PM tasks directly in the current repository checkout."
dependencies:
  tools:
    - type: "mcp"
      value: "serena"
      description: "Semantic code exploration and symbol/reference analysis."
    - type: "mcp"
      value: "github"
      description: "GitHub Issues or Projects task retrieval when available."
    - type: "mcp"
      value: "notion"
      description: "Optional Notion task retrieval when requested."
policy:
  allow_implicit_invocation: false
