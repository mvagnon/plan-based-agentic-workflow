interface:
  display_name: "Implement PM"
  short_description: "Implement PM tasks from required PM inputs."
  default_prompt: "Use this skill when the request provides both required inputs: PM system name and exact task IDs. The skill creates and pushes branch {pm-tool}/{task-ids}, retrieves the referenced PM tasks, studies the repository with Serena MCP, and focuses only on implementation. It does not create PRs, write PM backlinks, update PR bodies, run review workflows, or mark PM tasks done."
dependencies:
  tools:
    - type: "mcp"
      value: "serena"
      description: "Required semantic code exploration and symbol/reference analysis."
policy:
  allow_implicit_invocation: true
