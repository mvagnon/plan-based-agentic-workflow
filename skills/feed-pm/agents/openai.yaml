interface:
  display_name: "Feed PM"
  short_description: "Create PM-ready engineering tasks."
  default_prompt: "Use $feed-pm to analyze this repo, ask focused question or clarification prompts to lock down the user's goal, scope, tradeoffs, and task granularity, then turn the requested work into concise technical GitHub Issues only after approval."
dependencies:
  tools:
    - type: "mcp"
      value: "serena"
      description: "Semantic code exploration and symbol/reference analysis."
    - type: "mcp"
      value: "github"
      description: "GitHub Issues or Projects task creation when available."
    - type: "mcp"
      value: "notion"
      description: "Optional Notion task creation when requested."
policy:
  allow_implicit_invocation: false
