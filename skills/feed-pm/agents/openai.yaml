interface:
  display_name: "Feed PM"
  short_description: "Create PM-ready engineering tasks."
  default_prompt: "Use $feed-pm in Plan mode when available to analyze this repo with Serena MCP, use built-in structured question or clarification prompts for remaining non-discoverable scope decisions, then turn the requested work into concise technical GitHub Issues only after explicit post-proposal approval."
dependencies:
  tools:
    - type: "mcp"
      value: "serena"
      description: "Required semantic code exploration and symbol/reference analysis."
    - type: "mcp"
      value: "github"
      description: "GitHub Issues or Projects task creation when available."
    - type: "mcp"
      value: "notion"
      description: "Optional Notion task creation when requested."
policy:
  allow_implicit_invocation: true
