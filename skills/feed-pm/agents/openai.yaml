interface:
  display_name: "Feed PM"
  short_description: "Plan PM-ready tasks, then create them after approval."
  default_prompt: "Use this skill when the user wants to turn a product request, feature scope, bug, refactor, or backlog idea into an implementation-ready plan and PM tasks. Requires a task/request description; pm_tool and project_id are optional. It analyzes the repository with Serena MCP, recommends Plan Mode for better reliability, uses the runner-native question or clarification tool when available, proposes a complete plan with PM tool, project, task split, dependencies, and verification, supports user challenges by preserving and revising the previous plan, creates PM tasks only after explicit approval, matches the user's task-description language, separates frontend/backend/devops work, and returns a concise recap with the next implement-pm request details. Trigger on feed PM, create issues, create PM tasks, split this work into tickets, prepare Jira/GitHub/Notion tasks, or plan-based agentic workflow."
dependencies:
  tools:
    - type: "mcp"
      value: "serena"
      description: "Required semantic code exploration and symbol/reference analysis."
policy:
  allow_implicit_invocation: true
