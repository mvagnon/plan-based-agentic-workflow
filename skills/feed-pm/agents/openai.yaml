interface:
  display_name: "Feed PM"
  short_description: "Create PM-ready engineering task plans."
  default_prompt: "Use this skill when the user wants to turn a product request, feature scope, bug, refactor, or backlog idea into implementation-ready PM tasks. It deeply analyzes the project with Serena MCP, loads matching architecture skills when available, uses built-in clarification/question tools when available and portable Decision Gates in normal chat otherwise to refine product, technical, and architecture intent, decomposes the work into technical tasks, writes persistent task plans under ~/pbaw-plans for senior-engineer review, revises those files through clarifications, and creates PM items only after explicit final confirmation to push the latest linked plan. Trigger on phrases like feed PM, create issues from this plan, split this work into tickets, prepare GitHub Issues or Notion tasks, or plan-based agentic workflow."
dependencies:
  tools:
    - type: "mcp"
      value: "serena"
      description: "Required semantic code exploration and symbol/reference analysis."
    - type: "mcp"
      value: "github"
      description: "Required for GitHub Issues or Projects task creation when available."
policy:
  allow_implicit_invocation: true
