interface:
  display_name: "Feed PM"
  short_description: "Create PM-ready engineering tasks."
  default_prompt: "Use this skill when the user wants to turn a product request, feature scope, bug, refactor, or backlog idea into implementation-ready PM tasks. It deeply analyzes the project with Serena MCP, loads matching architecture skills when available, uses clarification/question tool when available to refine the request, decomposes the work into technical tasks, drafts concise but complete issue descriptions for senior-engineer review, and only creates PM items after explicit post-proposal approval. Trigger on phrases like feed PM, create issues from this plan, split this work into tickets, prepare GitHub Issues or Notion tasks, or plan-based agentic workflow."
dependencies:
  tools:
    - type: "mcp"
      value: "serena"
      description: "Required semantic code exploration and symbol/reference analysis."
    - type: "mcp"
      value: "github"
      description: "Required for GitHub Issues or Projects task creation when available."
policy:
  allow_implicit_invocation: true
