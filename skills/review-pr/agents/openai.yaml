interface:
  display_name: "Review PR"
  short_description: "Review PRs, run full local CI, reconcile descriptions, comment, mark strong drafts ready, and propose approved merge finalization."
  default_prompt: "Use when one or more pull requests exist and the user intends to polish or merge PRs. It resolves PRs from the current repository or child repositories in a multi-repo workspace, commits and pushes every staged, unstaged, or untracked local change in the affected repo before proceeding, performs strict production-readiness review with especially strict architecture-boundary checks, runs the full local CI suite before commenting, reports out-of-scope CI failures in the PR comment, reconciles PR descriptions with actual diffs, adds concise score/details comments, adds inline comments for actionable fixes, marks high-scoring draft PRs ready for review, and proposes or performs approval-gated merge finalization for production-ready PRs."
dependencies:
  tools:
    - type: "cli"
      value: "gh"
      description: "Required GitHub PR diff, body edit, review comment, and ready-for-review operations."
    - type: "mcp"
      value: "serena"
      description: "Required semantic code exploration and symbol/reference analysis."
policy:
  allow_implicit_invocation: true
