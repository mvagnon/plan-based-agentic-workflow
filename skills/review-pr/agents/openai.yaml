interface:
  display_name: "Review PR"
  short_description: "Review a PR, reconcile its description, resolve stale threads, add review comments, mark strong draft PRs ready, and propose approved merge finalization."
  default_prompt: "Use $review-pr to review this PR with Serena MCP, reconcile the PR description with the diff, resolve stale already-addressed conversations, add one concise score/details PR comment, add inline comments for actionable fixes, mark it ready for review only if the score is greater than 18/20, recommend $fix-pr from the PR branch when fixes or reviewer clarifications are needed, and for PROD READY PRs propose or perform approval-gated merge finalization."
dependencies:
  tools:
    - type: "cli"
      value: "gh"
      description: "GitHub PR diff, body edit, review comment, and ready-for-review operations."
    - type: "mcp"
      value: "serena"
      description: "Required semantic code exploration and symbol/reference analysis."
policy:
  allow_implicit_invocation: true
