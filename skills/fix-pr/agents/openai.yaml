interface:
  display_name: "Fix PR"
  short_description: "Fix PR review feedback and update PR conversations."
  default_prompt: 'Use this skill after a PR review, low score, requested changes, "fix before merge" verdict, inline comments, or reviewer recommendations in the plan-based agentic workflow. By default it fixes the PR associated with the current branch, analyzes the whole PR and review feedback, uses structured clarification/question tool when available for ambiguous fixes that need user decisions, applies focused corrections in the current checkout, runs relevant checks, commits and pushes the PR branch, then replies to and resolves GitHub review threads with gh CLI/API when possible.'
dependencies:
  tools:
    - type: "cli"
      value: "gh"
      description: "Required GitHub PR inspection, comments, review threads, checks, and push-related operations."
    - type: "mcp"
      value: "serena"
      description: "Required semantic code exploration and symbol/reference analysis."
policy:
  allow_implicit_invocation: true
