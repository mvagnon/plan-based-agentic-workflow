interface:
  display_name: "Fix PR"
  short_description: "Fix PR feedback with at most one Decision Gate."
  default_prompt: 'Use this skill after a PR review, low score, requested changes, "fix before merge" verdict, inline comments, failed checks, or reviewer recommendations. It resolves the PR, collects feedback, uses at most one normal-chat Decision Gate when remediation needs user or architect input, applies focused fixes with Serena MCP, runs relevant checks, commits and pushes, then updates PR conversations. It does not use runner-specific clarification tools and does not loop.'
dependencies:
  tools:
    - type: "cli"
      value: "gh"
      description: "Required GitHub PR inspection, comments, review threads, checks, and push-related operations."
    - type: "mcp"
      value: "serena"
      description: "Required semantic code exploration and symbol/reference analysis."
policy:
  allow_implicit_invocation: true
