interface:
  display_name: "Fix PR"
  short_description: "Fix PR feedback after an explicitly approved remediation plan."
  default_prompt: 'Use this skill after a PR review, low score, requested changes, "fix before merge" verdict, inline comments, failed checks, or reviewer recommendations. It resolves the PR, collects feedback, recommends Plan Mode, uses the runner-native question or clarification tool when available, proposes a complete remediation plan for explicit approval, supports user challenges by preserving and revising the previous plan, applies the approved focused fixes with Serena MCP, runs relevant checks, commits and pushes, then updates PR conversations. It does not rescore, approve, merge, close tasks, or move PM items.'
dependencies:
  tools:
    - type: "cli"
      value: "gh"
      description: "Required GitHub PR inspection, comments, review threads, checks, and push-related operations."
    - type: "mcp"
      value: "serena"
      description: "Required semantic code exploration and symbol/reference analysis."
policy:
  allow_implicit_invocation: true
