interface:
  display_name: "Create PR"
  short_description: "Create draft PRs from PM branches, backlink tasks, then run review-pr."
  default_prompt: "Use this skill after implement-pm when implementation branches already exist. It derives the PM tool and task IDs from branches named `{pm-tool}/{task-ids}`, creates draft PRs for the current repository and matching child repositories, attaches PM task URLs in concise PR bodies, writes PR URLs back to the PM tasks, verifies the links, and immediately runs review-pr. Trigger on create PR, open draft PR, backlink PM tasks, or continue after implement-pm."
dependencies:
  tools:
    - type: "cli"
      value: "gh"
      description: "Required for GitHub PR creation and GitHub issue linking when GitHub is used."
policy:
  allow_implicit_invocation: true
